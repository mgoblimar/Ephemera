name: ephemera_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.2.1
  http: ^1.6.0
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OpenSauceSans-OFL.txt
  # Open Sauce Sans (SIL Open Font License), bundled: it isn't on Google Fonts.
  fonts:
    - family: Open Sauce Sans
      fonts:
        - asset: assets/fonts/OpenSauceSans-Regular.ttf
        - asset: assets/fonts/OpenSauceSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSauceSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSauceSans-Bold.ttf
          weight: 700
